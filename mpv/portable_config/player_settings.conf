# ==============================================================================
# MPV Player Settings (إعدادات مشغل MPV الموحدة والشاملة)
# ==============================================================================
# هذا هو ملف التكوين الموحد والوحيد لكافة إعدادات المشغل الحية:
# (اللغة، مقياس الواجهة، أنماط وخطوط الترجمة، الشيدرز، ومحرك RIFE AI).
# يتم الحفظ والتطبيق فورياً عبر واجهة المشغل التفاعلية.

# ------------------------------------------------------------------------------
# 1. لغة الواجهة والمشغل ومقياس العرض (Interface Language & Scaling)
# ------------------------------------------------------------------------------
# ar  = الواجهة بالعربية، القائمة الجانبية باليمين، وأزرار التحكم بالنافذة باليسار LTR
# eng = Standard English, Left Sidebar, Right Window Controls
language=eng
ui_scale=1.00

# ------------------------------------------------------------------------------
# 2. أنماط الترجمة والخطوط (Subtitle Styles & Fonts)
# ------------------------------------------------------------------------------
# sub_ass_override: وضع نمط الترجمة
#   no    = نمط المصدر الأصلي (Prefer Embedded Style - Original Font & Styles)
#   force = استخدام النمط المخصص المختار (Use My Own Style - Forced Sub Font)
sub_ass_override=no

sub_font=XB Zar
sub_font_size=50
sub_color=#FFFFFF
sub_border_size=2
sub_border_color=#000000
sub_border_style=outline-and-shadow
sub_back_color=#00000000
sub_pos=98
sub_spacing=0

# ------------------------------------------------------------------------------
# 3. الشيدرز النشطة (Active GLSL & Hook Shaders)
# ------------------------------------------------------------------------------
shaders=

# ------------------------------------------------------------------------------
# 4. محرك توليد الفريمات بالذكاء الاصطناعي (RIFE AI Interpolation)
# ------------------------------------------------------------------------------
# model: اختيار نموذج RIFE الذكي
#   1 = RIFE v4.25 (الأعلى دقة وتفاصيل)
#   2 = RIFE v4.25 Lite (سريع ودقيق جداً)
#   3 = RIFE v4.22 Lite (متوازن ومستقر)
#   4 = RIFE v4.17 Lite (فائق السرعة والأخف)
model=4

# multi: مضاعف عدد الإطارات
#   2 = 2x (افتراضي / قياسي)
#   3 = 3x (سلس)
#   4 = 4x (سلاسة عالية)
#   5 = 5x (فائق السلاسة)
#   6 = 6x (أقصى مستوى)
multi=2

# streams: مسارات المعالجة المتزامنة في كرت الشاشة (1 إلى 6)
#   1 = استخدام ذاكرة VRAM منخفض
#   2 = المسار الأمثل (افتراضي)
#   3 إلى 6 = توازي عالي للكروت القوية
streams=2

# uhd_mode: نمط التعامل مع فيديوهات 4K / UHD
#   1 = إيقاف RIFE بالكامل في فيديوهات 4K (تشغيل أصلي خام 100% - موصى به)
#   2 = تحجيم مؤقت إلى 1080p لتوليد فريمات سلسة بدون ضغط عالي
uhd_mode=1

# ------------------------------------------------------------------------------
# 5. إعدادات متقدمة لذاكرة التخزين ومحرك TensorRT
# ------------------------------------------------------------------------------
# max_cache_size: ذاكرة الرام المؤقتة بالميجابايت (VapourSynth Host RAM) لمعالجة الفريمات (8192 = 8GB RAM)
max_cache_size=8192
max_source_fps=70
fp16=true
cuda_graph=false
sc_threshold=0.10

# ------------------------------------------------------------------------------
# 6. عداد الإطارات الفعلي اللحظي (Real-Time FPS Counter HUD)
# ------------------------------------------------------------------------------
fps_counter=no
fps_counter_pos=top-right
# active: تفعيل/تعطيل فلتر RIFE عند بدء التشغيل
#   yes = تشغيل الفلتر تلقائياً
#   no  = متوقف افتراضياً
active=yes

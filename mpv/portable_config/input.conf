# ===================================================================
# MPV INPUT CONFIGURATION (إعدادات الاختصارات والتحكم الكاملة)
# ===================================================================

# ----------------- الفأرة (Mouse Controls) -----------------
MBTN_RIGHT      cycle pause         # كليك يمين لإيقاف/تشغيل المقطع فورياً
MBTN_RIGHT_DBL  ignore              # تجاهل الدبل كليك يمين
MBTN_LEFT_DBL   cycle fullscreen    # دبل كليك يسار لتكبير وتصغير الشاشة
MBTN_MID        script-binding sidebar_settings/sidebar_toggle # ضغط العجلة لفتح لوحة الإعدادات الجانبية المدمجة
SPACE           cycle pause         # مسافة للإيقاف والتشغيل

# ----------------- الصوت (Volume & Audio) -----------------
WHEEL_UP        no-osd add volume 2
WHEEL_DOWN      no-osd add volume -2
UP              no-osd add volume 2
DOWN            no-osd add volume -2
AXIS_UP         no-osd add volume 2
AXIS_DOWN       no-osd add volume -2
+               add audio-delay 0.010
-               add audio-delay -0.010
a               cycle audio

# ----------------- التقديم والتأخير (Seeking) -----------------
RIGHT           seek 5
LEFT            seek -5
Ctrl+RIGHT      seek 85 exact
Ctrl+LEFT       seek -85 exact
Shift+RIGHT     frame-step
Shift+LEFT      frame-back-step
H               seek -65
h               seek 65
t               script-message-to seek_to toggle-seeker

# ----------------- الترجمة (Subtitles) -----------------
s               cycle sub
S               script-binding select/select-sid    # فتح قائمة الترجمات المنسدلة
z               add sub-delay -0.1                  # تقديم توقيت الترجمة 0.1 ثانية
Z               add sub-delay -0.1
x               add sub-delay +0.1                  # تأخير توقيت الترجمة 0.1 ثانية
X               add sub-delay +0.1
Ctrl+z          set sub-delay 0                     # إعادة ضبط توقيت الترجمة للأصل


# ----------------- الذكاء الاصطناعي (AI RIFE Interpolation) -----------------
F1              script-binding mode_notify/toggle_rife  # تشغيل/تعطيل مضاعفة الفريمات وحفظ الحالة
# F2            (فارغ وغير مستخدم)
# F3            (فارغ وغير مستخدم)

# ----------------- الفيديو والعرض (Video & Display) -----------------
v               cycle deband
i               script-binding stats/display-stats-toggle
I               script-binding stats/display-stats-toggle
TAB             script-binding stats/display-stats-toggle
F4              cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
F               script-binding quality_menu/video_formats_toggle
Alt+f           script-binding quality_menu/audio_formats_toggle
Ctrl+r          script-binding quality_menu/reload
p               script-binding playlistmanager/showplaylist

# ----------------- التكبير والتحريك (Zoom & Pan) -----------------
Alt++           add video-zoom 0.25
Alt+-           add video-zoom -0.25
kp8             add video-pan-y 0.05
kp6             add video-pan-x -0.05
kp2             add video-pan-y -0.05
kp4             add video-pan-x 0.05
kp5             set video-pan-x 0; set video-pan-y 0; set video-zoom 0

# ----------------- التحكم العام والإغلاق (General & Exit) -----------------
q               quit
ESC             set fullscreen no
CLOSE_WIN       quit

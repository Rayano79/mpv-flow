&Video
	&Track	$video-tracks
	
	&Aspect Ratio
		&16:9		set video-aspect-override 16:9		checked=video_aspect_override and math.abs(video_aspect_override - 16/9) < 1e-12
		&4:3		set video-aspect-override 4:3		checked=video_aspect_override and math.abs(video_aspect_override - 4/3) < 1e-12
		&2.35:1 (Cinemascope)	set video-aspect-override 2.35:1	checked=video_aspect_override == 2.35
		&Default (Auto)	set video-aspect-override no		checked=video_aspect_override == -2
	&Zoom & Scaling
		&Fill Screen (Crop Black Bars)	no-osd cycle-values panscan 0 1; no-osd set video-unscaled no; no-osd set video-zoom 0	checked=panscan == 1
		&Stretch to Window	no-osd cycle keepaspect	checked=not keepaspect
		&Original Size (1:1 Unscaled)	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0	checked=video_unscaled
		
		50%		set video-zoom -0.5	checked=video_zoom == -0.5
		75%		set video-zoom -0.25	checked=video_zoom == -0.25
		100% (Normal)	set video-zoom 0	checked=video_zoom == 0
		125%	set video-zoom 0.25	checked=video_zoom == 0.25
		150%	set video-zoom 0.5	checked=video_zoom == 0.5
		200%	set video-zoom 1	checked=video_zoom == 1
		
		Zoom In (+10%)	add video-zoom 0.1
		Zoom Out (-10%)	add video-zoom -0.1
		&Reset Zoom & Position	no-osd set video-zoom 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set panscan 0; no-osd set video-unscaled no; no-osd set keepaspect yes
	&Orientation & Rotation
		Rotate 90° Clockwise	cycle-values video-rotate 90 180 270 0
		Rotate 90° Counter-Clockwise	cycle-values video-rotate 270 180 90 0
		Reset Rotation (0°)	set video-rotate 0	checked=video_rotate == 0
	
	&Color & Picture Adjustments
		&Brightness
			0 (Default)	set brightness 0	checked=brightness == 0
			+5	set brightness 5	checked=brightness == 5
			+10	set brightness 10	checked=brightness == 10
			+20	set brightness 20	checked=brightness == 20
			-5	set brightness -5	checked=brightness == -5
			-10	set brightness -10	checked=brightness == -10
			-20	set brightness -20	checked=brightness == -20
			Increase (+2)	add brightness 2
			Decrease (-2)	add brightness -2
		&Contrast
			0 (Default)	set contrast 0	checked=contrast == 0
			+5	set contrast 5	checked=contrast == 5
			+10	set contrast 10	checked=contrast == 10
			+20	set contrast 20	checked=contrast == 20
			-5	set contrast -5	checked=contrast == -5
			-10	set contrast -10	checked=contrast == -10
			-20	set contrast -20	checked=contrast == -20
			Increase (+2)	add contrast 2
			Decrease (-2)	add contrast -2
		&Saturation (Color Vibrancy)
			0 (Default)	set saturation 0	checked=saturation == 0
			+10 (Vivid)	set saturation 10	checked=saturation == 10
			+25 (High Color)	set saturation 25	checked=saturation == 25
			+50	set saturation 50	checked=saturation == 50
			-25 (Muted)	set saturation -25	checked=saturation == -25
			-100 (Monochrome / B&W)	set saturation -100	checked=saturation == -100
			Increase (+5)	add saturation 5
			Decrease (-5)	add saturation -5
		&Gamma (Shadow / Midtones)
			0 (Default)	set gamma 0	checked=gamma == 0
			+5 (Brighten Shadows)	set gamma 5	checked=gamma == 5
			+10	set gamma 10	checked=gamma == 10
			+20	set gamma 20	checked=gamma == 20
			-5	set gamma -5	checked=gamma == -5
			-10	set gamma -10	checked=gamma == -10
			-20	set gamma -20	checked=gamma == -20
			Increase (+2)	add gamma 2
			Decrease (-2)	add gamma -2
		
		&Color Profile Presets
			Natural (Default)	set brightness 0; set contrast 0; set saturation 0; set gamma 0; set hue 0; show-text "Picture: Natural"	checked=brightness == 0 and contrast == 0 and saturation == 0 and gamma == 0
			Vivid Boost	set brightness 2; set contrast 5; set saturation 15; set gamma 0; show-text "Picture: Vivid Boost"	checked=contrast == 5 and saturation == 15
			Dark Scene Enhancer	set brightness 5; set contrast 5; set saturation 0; set gamma 10; show-text "Picture: Dark Scene Enhancer"	checked=gamma == 10 and brightness == 5
			Cinema Contrast	set brightness -2; set contrast 10; set saturation 5; set gamma -2; show-text "Picture: Cinema Contrast"	checked=contrast == 10 and saturation == 5
			Black & White	set brightness 0; set contrast 5; set saturation -100; set gamma 0; show-text "Picture: Black & White"	checked=saturation == -100
		
		&Reset Color Adjustments	set brightness 0; set contrast 0; set saturation 0; set gamma 0; set hue 0; show-text "Color adjustments reset"
	

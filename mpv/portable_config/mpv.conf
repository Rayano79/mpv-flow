# ==============================================================================
# MPV Player Configuration (Pure, High-Performance & TensorRT RIFE Integrated)
# ==============================================================================

# General & Display (محرك العرض وفك التشفير بالعتاد لـ RIFE)
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va-copy
d3d11-flip=no
d3d11-sync-interval=0
priority=high
fullscreen=no
autofit-larger=80%x80%
autofit-smaller=30%x30%
keep-open=always
keep-open-pause=yes

# Audio-Video Synchronization & Instant Seeking (التزامن الصوتي وسرعة القفز)
video-sync=audio
hr-seek=no
hr-seek-framedrop=no

# UI & Interface (ModernZ واجهة المودرن والأوفرلاي)
osc=no
osd-bar=no
border=no
msg-color=yes
term-osd-bar=yes
no-hidpi-window-scale
force-window=immediate
cursor-autohide=1000

# Quit & Resume Options (حفظ مكان التوقف وتذكر حالة الشاشة السابقة)
save-position-on-quit=yes
watch-later-options-remove=vf,af,sub-pos,osd-margin-y,glsl-shaders,sub-ass-override
reset-on-next-file=audio-delay,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom

# Screenshots (التقاط الصور بأعلى دقة وتنسيق منظم)
screenshot-format=png
screenshot-png-compression=4
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
screenshot-template="%x/Screens/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"

# Colorspace & Dither & HDR (نطاق الألوان وتدرج البتات ودعم شاشات العرض)
video-output-levels=full
dither-depth=auto
temporal-dither=yes
dither=fruit
dither-size-fruit=2
target-colorspace-hint=yes

# Debanding (تنقية تدرجات الألوان ومنع التقطيع اللوني)
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48

# Subtitles (إعدادات الترجمة)
blend-subtitles=no
subs-with-matching-audio=no
subs-fallback=yes
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
sub-codepage=auto
sub-fonts-dir="~~/fonts"
sub-font='XB Zar'
sub-font-size=45
sub-color='#FFFFFF'
sub-border-size=2
sub-border-color='#000000'
sub-ass-override=no
sub-vsfilter-bidi-compat=yes

# High-Quality Scaling (خوارزمية ميتشل للتحجيم فائق الجودة)
scale=mitchell
cscale=mitchell
dscale=mitchell
sigmoid-upscaling=no
correct-downscaling=yes
linear-downscaling=no
linear-upscaling=no
scaler-resizes-only=yes
scale-param1=1
scale-param2=0
cscale-param1=1
cscale-param2=0
dscale-param1=1
dscale-param2=0

# Audio Settings (إعدادات ومعالجة الصوت وتوزيعه)
volume-max=130
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-stream-silence=no
audio-normalize-downmix=yes
audio-resample-linear=yes
audio-channels=auto-safe
ad-lavc-downmix=yes
aid=auto

# AI Video Interpolation (توليد الإطارات بمحرك RIFE TensorRT)
vf=vapoursynth="~~/vs/interpolation.vpy":4:4

# Streaming & Cache Protocols (البث المباشر والكاش لليوتيوب وروابط النت)
[protocol.http]
hls-bitrate=max
cache=yes
no-cache-pause

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http


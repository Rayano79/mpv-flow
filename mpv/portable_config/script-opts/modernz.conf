# ModernZ configuration file

# Language and display
language=eng
layout=default
icon_theme=fluent
icon_style=mixed
font=mpv-osd-symbols

idlescreen=yes
window_top_bar=auto

# show chapter title below video title
show_chapter_title=yes
# show chapter name on the title bar with custom formatting: "no", "index", "title", "all"
chapter_fmt=all
# truncate title / chapter if longer than width limit
truncate_title=yes

# Title bar settings
# show window title in borderless/fullscreen mode
show_window_title=no
window_title_font_size=18
# show window controls (close, minimize, maximize) in borderless/fullscreen
window_controls=yes
windowcontrols_independent=yes

volume_control_type=linear
volumebar_unmute_on_click=no
playlist_button=yes
settings_button=yes
settings_mbtn_left_command=script-message toggle_sidebar
settings_mbtn_mid_command=script-message toggle_sidebar
hide_empty_playlist_button=no
gray_empty_playlist_button=no

fullscreen_button=yes
info_button=yes
ontop_button=yes
ontop_in_topbar=no
screenshot_button=yes

download_button=yes
download_path=~~desktop/mpv

loop_button=yes
shuffle_button=no
speed_button=yes
speed_font_size=14

buttons_always_active=none

playpause_size=28
midbuttons_size=24
sidebuttons_size=24

zoom_control=yes
zoom_in_max=4
zoom_out_min=-1

# Colors and style
osc_color=#000000
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
windowcontrols_close_hover=#F45C5B
windowcontrols_max_hover=#F8BC3A
windowcontrols_min_hover=#43CB44
title_color=#FFFFFF
cache_info_color=#FFFFFF
seekbar_cache_color=#B1B1B1
seekbarfg_color=#8A2BE2
seekbarbg_color=#999999
seek_handle_color=#5D1F96
seek_handle_border_color=#8A2BE2
volumebar_match_seek_color=no
time_color=#FFFFFF
chapter_title_color=#FFFFFF
side_buttons_color=#FFFFFF
middle_buttons_color=#FFFFFF
playpause_color=#FFFFFF
held_element_color=#999999
hover_effect_color=#8A2BE2
thumbnail_box_color=#111111
thumbnail_box_outline=#404040
nibble_color=#5D1F96
nibble_current_color=#FFFFFF
ab_loop_color=#2596be

osc_fade_strength=100
fade_blur_strength=100
fade_transparency_strength=0
window_fade_strength=100
window_fade_blur_strength=100
window_fade_transparency_strength=0
thumbnail_box_padding=4.5
thumbnail_box_radius=4
thumbnail_box_outline_size=1

# Button interaction settings
hover_effect=size,glow,color,box,bg
button_hover_size=115
button_held_size=100
button_held_box_alpha=18
button_glow_amount=5
slider_hover_size=100
tooltip_hints=yes

# Progress bar settings
seek_handle_size=0.8
seek_handle_border_size=0.42
seek_handle_border_hover_size=0.31
seekbar_height=medium
seekrange=yes
seekrangealpha=150
livemarkers=yes
seekbarkeyframes=yes
slider_rounded_corners=yes

nibbles_style=gap
nibbles_top=yes
nibbles_bottom=yes
automatickeyframemode=yes
automatickeyframelimit=600

persistent_progress=no
persistent_progress_height=17
persistent_buffer=no

# Miscellaneous settings
visibility=auto
visibility_modes=never_auto_always
tick_delay=0.0167
tick_delay_follow_display_fps=no

# Elements Position
title_offset=20
title_with_chapter_offset=5
chapter_title_offset=18
chapter_above_title_offset=3
time_codes_offset=0
tooltip_height_offset=5
portrait_window_trigger=950
hide_volume_bar_trigger=650
osc_height=60

## Mouse commands (Clean Direct Commands)
# title mouse actions
title_mbtn_left_command=script-binding stats/display-stats-toggle
title_mbtn_mid_command=show-text "${filename}" 3000
title_mbtn_right_command=show-text "${path}" 4000

# chapter title mouse actions
chapter_title_mbtn_left_command=show-text "${chapter-list}" 3000
chapter_title_mbtn_right_command=show-text "${chapter-list}" 3000

# seekbar wheel actions
seekbar_wheel_up_command=seek 10
seekbar_wheel_down_command=seek -10

# playlist button mouse actions
playlist_mbtn_left_command=script-binding playlistmanager/showplaylist
playlist_mbtn_right_command=show-text "${playlist}" 3000

# volume mouse actions
vol_ctrl_mbtn_left_command=no-osd cycle mute
vol_ctrl_mbtn_right_command=cycle audio
vol_ctrl_wheel_down_command=no-osd add volume -5
vol_ctrl_wheel_up_command=no-osd add volume 5
volumebar_wheel_down_command=no-osd add volume -5
volumebar_wheel_up_command=no-osd add volume 5

# audio button mouse actions
audio_track_mbtn_left_command=cycle audio
audio_track_mbtn_mid_command=cycle audio down
audio_track_mbtn_right_command=script-binding select/select-aid
audio_track_wheel_down_command=cycle audio
audio_track_wheel_up_command=cycle audio down

# subtitle button mouse actions
sub_track_mbtn_left_command=script-binding select/select-sid
sub_track_mbtn_mid_command=cycle sub down
sub_track_mbtn_right_command=script-binding select/select-sid
sub_track_wheel_down_command=cycle sub
sub_track_wheel_up_command=cycle sub down

# play/pause button mouse actions
play_pause_mbtn_left_command=cycle pause
play_pause_mbtn_mid_command=cycle-values loop-playlist inf no
play_pause_mbtn_right_command=cycle-values loop-file inf no

# chapter skip buttons mouse actions
chapter_prev_mbtn_left_command=add chapter -1
chapter_prev_mbtn_mid_command=show-text "${chapter-list}" 3000
chapter_prev_mbtn_right_command=add chapter -1

chapter_next_mbtn_left_command=add chapter 1
chapter_next_mbtn_mid_command=show-text "${chapter-list}" 3000
chapter_next_mbtn_right_command=add chapter 1

# playlist skip buttons mouse actions
playlist_prev_mbtn_left_command=playlist-prev
playlist_prev_mbtn_mid_command=show-text "${playlist}" 3000
playlist_prev_mbtn_right_command=script-binding playlistmanager/showplaylist

playlist_next_mbtn_left_command=playlist-next
playlist_next_mbtn_mid_command=show-text "${playlist}" 3000
playlist_next_mbtn_right_command=script-binding playlistmanager/showplaylist

# fullscreen button mouse actions
fullscreen_mbtn_left_command=cycle fullscreen
fullscreen_mbtn_right_command=cycle window-maximized

# info button mouse actions
info_mbtn_left_command=script-binding stats/display-stats-toggle

# ontop (pin) button mouse actions
ontop_mbtn_left_command=osd-msg cycle ontop

# screenshot button mouse actions
screenshot_mbtn_left_command=osd-msg screenshot video

# loop file button mouse actions
file_loop_mbtn_left_command=osd-msg cycle-values loop-file inf no
file_loop_mbtn_right_command=osd-msg cycle-values loop-playlist inf no

# speed button mouse actions
speed_mbtn_left_command=osd-msg add speed 1
speed_mbtn_right_command=osd-msg set speed 1
speed_wheel_down_command=osd-msg add speed -0.25
speed_wheel_up_command=osd-msg add speed 0.25
